<title>NK iRacing racepace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<!--
  Valkra Performance · NK iRacing 2026 · pace voor de komende race

  Deployment
  - De pagina haalt bij het openen de laatste JSON op uit GitHub (data/valkra-nk-prequal.json in Diegoteun/nkiracing2026-valkra).
    De bestandsnaam is gelijk gebleven zodat de upload (/upload) blijft werken; de racedata staat onder de sleutel "race".
  - Instellingen (optioneel), vóór dit bestand of bovenaan de pagina:
      <script>window.VALKRA_PREQUAL_CONFIG = { dataUrl: "/data/valkra-nk-prequal.json", uploadUrl: "/admin/prequal-data" };</script>
  - Beheer: open de pagina met #beheer achter de URL om de knop "JSON importeren" te tonen.
  - Bevat een ingebouwde kopie van de data als terugval, zodat het bestand los ook werkt.
-->
<style>
/* Layout: dark hero, four KPI tiles, the team card, then one card per split. Single light theme: it sits inside the light Valkra site. */
:root {
  color-scheme: light;
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --ink: #111827;
  --ink-2: #4B5563;
  --muted: #6B7280;
  --line: #E5E7EB;
  --grid: #EEF0F3;
  --axis: #CBD0D6;
  --yellow: #FEEA27;
  --yellow-wash: rgba(254, 234, 39, 0.32);
  --ok: #067647;
  --err: #B42318;
  --sans: "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55; margin: 0; }
.wrap {
  max-width: 1120px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
.eyebrow { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; }

/* Admin bar, only with #beheer */
.admin { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; background: var(--surface); border: 1px dashed var(--axis); border-radius: 10px; padding: 12px 14px; }
.admin[hidden] { display: none; }
.admin strong { font-weight: 600; }
.btn { font: 500 13px var(--sans); background: var(--yellow); color: var(--ink); border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.btn.ghost { background: var(--surface); border: 1px solid var(--line); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.admin .msg { font-size: 12.5px; color: var(--ink-2); flex-basis: 100%; }
.admin .msg.ok { color: var(--ok); }
.admin .msg.err { color: var(--err); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Hero */
.hero { background: var(--ink); color: #FFFFFF; border-radius: 12px; padding: 28px clamp(18px, 4vw, 36px); display: grid; gap: 10px; }
.hero .eyebrow { color: rgba(255, 255, 255, 0.7); }
.hero h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); font-weight: 700; line-height: 1.08; letter-spacing: -0.02em; text-wrap: balance; }
.hero p { margin: 0; max-width: 68ch; color: rgba(255, 255, 255, 0.78); font-weight: 300; font-size: 15px; }
.hero .stamp { justify-self: start; background: var(--yellow); color: var(--ink); font-weight: 500; font-size: 13px; padding: 6px 12px; border-radius: 8px; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 820px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.tile .lbl { font-size: 12.5px; color: var(--muted); }
.tile .val { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: 12.5px; color: var(--ink-2); }
.tile.goal { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
.tile.goal .lbl, .tile.goal .sub { color: rgba(255, 255, 255, 0.72); }
.tile.goal .val { color: var(--yellow); }
.tile.accent { background: var(--yellow); border-color: var(--yellow); }
.tile.accent .lbl, .tile.accent .sub { color: var(--ink); opacity: 0.8; }

/* Cards */
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 920px) { .row2 { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card[hidden] { display: none; }
.card h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.card h3 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.cap { margin: 0; font-size: 12.5px; color: var(--muted); max-width: 80ch; }
.ttl { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.ttl .rng { font-size: 12.5px; color: var(--muted); }

/* Target block per split */
.pace3 { background: var(--ink); color: #FFFFFF; border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.pace3.s2 { background: var(--yellow); color: var(--ink); }
.pace3 .lbl { font-size: 12.5px; opacity: 0.78; }
.pace3 .val { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.pace3:not(.s2) .val { color: var(--yellow); }
.pace3 .sub { font-size: 12.5px; opacity: 0.85; }
.mini3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mini3 > div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 1px; min-width: 0; }
.mini3 .lbl { font-size: 11.5px; color: var(--muted); }
.mini3 .v { font: 600 14.5px var(--mono); }
.mini3 .s { font-size: 11.5px; color: var(--muted); }

/* Tables */
.tbox { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
.stbl th { font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.stbl td { padding: 6px 8px; text-align: right; font-family: var(--mono); font-size: 12.5px; border-bottom: 1px solid var(--grid); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stbl th.l, .stbl td.l { text-align: left; }
.stbl td.nm { font-family: var(--sans); font-weight: 500; white-space: normal; line-height: 1.25; min-width: 140px; }
.stbl td.nm small { display: block; font: 400 11.5px var(--sans); color: var(--muted); }
.stbl tr.top3 td { background: var(--yellow-wash); }
.stbl tr.team td.nm { font-weight: 700; }
.stbl tr.team td:first-child { box-shadow: inset 3px 0 0 var(--ink); }
.stbl tr:last-child td { border-bottom: 0; }
.stbl small.r { color: var(--muted); font-size: 11px; }
.tag { display: inline-block; font: 600 10.5px var(--sans); letter-spacing: 0.04em; padding: 1px 6px; border-radius: 5px; background: var(--ink); color: var(--yellow); margin-left: 6px; vertical-align: 1px; }
.est { font: 400 10.5px var(--sans); color: var(--muted); margin-left: 4px; }
.gap { font-weight: 600; }
.gap.in { color: var(--ok); }
.gap.out { color: var(--ink); }
.split { display: inline-block; font: 600 11px var(--sans); letter-spacing: 0.04em; padding: 2px 8px; border-radius: 6px; background: var(--line); color: var(--ink); }
.split.s1 { background: var(--ink); color: var(--yellow); }
.none { color: var(--muted); opacity: 0.6; }
.showall { font: 500 13px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; justify-self: start; }
.showall:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.teamcard { border-color: var(--ink); }

.foot { font-size: 12px; color: var(--muted); display: grid; gap: 6px; max-width: 90ch; }
.foot p { margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <section class="admin" id="admin" hidden aria-label="Data bijwerken">
    <strong>Data bijwerken</strong>
    <label class="btn" for="file">JSON importeren</label>
    <input class="visually-hidden" type="file" id="file" accept="application/json,.json">
    <button type="button" class="btn ghost" id="reset">Terug naar gepubliceerde data</button>
    <span class="msg" id="admin-msg" role="status">Kies een nieuw valkra-nk-prequal.json.</span>
  </section>

  <header class="hero">
    <div class="eyebrow">Valkra Performance · Data · NK iRacing 2026</div>
    <h1 id="hero-h1">Pace voor de komende race</h1>
    <p id="hero-p">Per split wie welke tijd reed, wat we op racedag verwachten en de target voor een top 3.</p>
    <span class="stamp" id="stamp">Data laden…</span>
  </header>

  <section class="tiles" id="tiles" aria-label="Kerncijfers"></section>

  <section class="card teamcard" id="team" aria-labelledby="team-title">
    <div class="ttl"><h2 id="team-title">Valkra Performance</h2><span class="rng" id="team-sub"></span></div>
    <p class="cap" id="team-cap"></p>
    <div class="tbox"><table class="stbl" id="teamtbl"></table></div>
  </section>

  <section class="row2" id="splits" aria-label="Splits"></section>

  <footer class="foot">
    <p id="note"></p>
    <p id="method"></p>
    <p id="source"></p>
  </footer>
</div>

<script>
const VALKRA_EMBEDDED_DATA = /*__DATA__*/null;
(() => {
  const CONFIG = Object.assign({ dataUrl: /*__DATA_URL__*/, uploadUrl: null }, window.VALKRA_PREQUAL_CONFIG || {});
  const $ = id => document.getElementById(id);

  /* Formatting */
  const fmtT = (t, d) => { const r = Math.round(t * 10 ** d) / 10 ** d; const m = Math.floor(r / 60); return m + ":" + (r - m * 60).toFixed(d).padStart(d + 3, "0"); };
  const lap = t => fmtT(t, 3);
  const nl = n => n.toLocaleString("nl-NL");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));
  const sgn = v => (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(3).replace(".", ",");
  const carShort = c => c ? String(c).replace(/ GT3.*$/, "").replace(/ EVO( II)?$/, "") : "";
  const trackShort = t => String(t || "").split(" – ")[0].replace(" International Racing Course", "").replace(" International Raceway", "");
  const dateNl = s => new Date(s).toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long", timeZone: "Europe/Amsterdam" });
  const timeNl = s => new Date(s).toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Amsterdam" });
  const gapHtml = v => v == null ? '<span class="none">–</span>' : `<span class="gap ${v <= 0 ? "in" : "out"}">${sgn(v)}</span>`;

  /* Validation of an imported or fetched data file */
  function problems(D) {
    const p = [];
    if (!D || typeof D !== "object") return ["geen JSON-object"];
    if (!D.meta || !D.meta.generated_at) p.push("meta.generated_at");
    if (!D.race || !Array.isArray(D.race.splits) || !D.race.splits.length) p.push("race.splits");
    return p;
  }

  const open = {};
  let current = null;

  function render(D) {
    current = D;
    const R = D.race, M = R.model;
    const shown = R.splits.filter(S => S.shown);

    /* Hero */
    $("hero-h1").textContent = `Ronde ${R.round}: ${trackShort(R.track)}`;
    $("hero-p").textContent = `Pace per split voor de race van ${dateNl(R.race_start)} om ${timeNl(R.race_start)}. Wie welke tijd reed in de testsessies, wat we op racedag verwachten en de target voor een top 3.`;
    const g = new Date(D.meta.generated_at);
    $("stamp").textContent = "Stand " + g.toLocaleDateString("nl-NL", { day: "numeric", month: "long", timeZone: "Europe/Amsterdam" }) + ", " + g.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Amsterdam" });

    /* Tiles */
    const tiles = shown.slice(0, 2).map((S, i) => ({ cls: i === 0 ? "goal" : "accent", lbl: `Target top 3 · split ${S.split}`, val: lap(S.target.p50), sub: `80% zeker tussen ${lap(S.target.p10)} en ${lap(S.target.p90)}` }));
    if (R.fastest) tiles.push({ cls: "", lbl: "Snelste testronde", val: lap(R.fastest.time), sub: `${esc(R.fastest.name)}${R.fastest.split ? ", split " + R.fastest.split : ""}${R.fastest.car ? ", " + esc(carShort(R.fastest.car)) : ""}` });
    tiles.push({ cls: "", lbl: "Testdata", val: nl(R.test_laps), sub: `ronden van ${R.test_drivers} rijders in ${R.test_sessions} sessies` });
    $("tiles").innerHTML = tiles.map(t => `<div class="tile ${t.cls}"><span class="lbl">${t.lbl}</span><span class="val">${t.val}</span><span class="sub">${t.sub}</span></div>`).join("");

    /* Team */
    const T = R.team_drivers || [];
    $("team").hidden = !T.length;
    $("team-title").textContent = R.team || "Team";
    $("team-sub").textContent = `${T.length} rijders`;
    $("team-cap").textContent = "Target = verwachte derde snelste tijd in de eigen split. Gat = tijd min target; groen = al binnen de target. Verwacht = gemiddelde snelste ronde op racedag.";
    $("teamtbl").innerHTML = `<thead><tr><th class="l">Rijder</th><th class="l">Split</th><th>Beste nu</th><th>Gat nu</th><th>Verwacht</th><th>Gat verwacht</th><th>Target</th><th>Top 3</th></tr></thead><tbody>` +
      T.map(d => `<tr>
        <td class="l nm">${esc(d.name)}<small>${esc(carShort(d.car))}${d.prequal_position ? " · prequal P" + d.prequal_position : ""}</small></td>
        <td class="l"><span class="split ${d.split === 1 ? "s1" : ""}">Split ${d.split}</span></td>
        <td>${d.best ? `${lap(d.best)} <small class="r">${d.laps}r</small>` : '<span class="none">nog niet gereden</span>'}</td>
        <td>${gapHtml(d.gap_to_target_now)}</td>
        <td>${lap(d.expected_pace.mean)}${d.estimated_only ? '<span class="est">schatting</span>' : ""}</td>
        <td>${gapHtml(d.gap_to_target_expected)}</td>
        <td>${lap(d.target)}</td>
        <td>${Math.round(d.chance_top3)}%</td></tr>`).join("") + `</tbody>`;

    /* Split cards */
    $("splits").innerHTML = shown.map(S => {
      const rows = S.drivers, isOpen = !!open[S.split];
      const list = isOpen ? rows : rows.filter((d, i) => i < 10 || d.is_team);
      const contenders = rows.filter(d => !d.best && d.chance_top3 >= 10).sort((a, b) => b.chance_top3 - a.chance_top3).slice(0, 4);
      return `<div class="card" data-split="${S.split}">
        <div class="ttl"><h3>Split ${S.split}</h3><span class="rng">prequal P${S.prequal_from}–P${S.prequal_to}</span></div>
        <div class="pace3 ${S.split === 2 ? "s2" : ""}">
          <span class="lbl">Target voor een top 3 op racedag</span>
          <span class="val">${lap(S.target.p50)}</span>
          <span class="sub">80% zeker tussen ${lap(S.target.p10)} en ${lap(S.target.p90)}${S.now.p3 ? `. Nu staat P3 op ${lap(S.now.p3)}` : ""}</span>
        </div>
        <div class="mini3">
          <div><span class="lbl">Winnaar-pace</span><span class="v">${lap(S.winner_pace.p50)}</span><span class="s">${lap(S.winner_pace.p10)}–${lap(S.winner_pace.p90)}</span></div>
          <div><span class="lbl">Top-10 pace</span><span class="v">${lap(S.top10_pace.p50)}</span><span class="s">${lap(S.top10_pace.p10)}–${lap(S.top10_pace.p90)}</span></div>
          <div><span class="lbl">Al gereden</span><span class="v">${S.with_time} van ${S.members}</span><span class="s">${S.now.p1 ? "snelste nu " + lap(S.now.p1) : "nog geen tijden"}</span></div>
        </div>
        <div class="tbox"><table class="stbl">
          <thead><tr><th class="l">#</th><th class="l">Rijder</th><th>Beste nu</th><th>Verwacht</th><th>Top 3</th></tr></thead>
          <tbody>${list.map(d => `<tr class="${d.rank_now && d.rank_now <= 3 ? "top3" : ""} ${d.is_team ? "team" : ""}">
            <td class="l">${d.rank_now || '<span class="none">–</span>'}</td>
            <td class="l nm">${esc(d.name)}${d.is_team ? '<span class="tag">Valkra</span>' : ""}<small>${[d.team && !d.is_team ? esc(d.team) : "", esc(carShort(d.car)), d.prequal_position ? "prequal P" + d.prequal_position : ""].filter(Boolean).join(" · ")}</small></td>
            <td>${d.best ? `${lap(d.best)} <small class="r">${d.laps}r</small>` : '<span class="none">–</span>'}</td>
            <td>${lap(d.expected_pace.mean)}${d.estimated_only ? '<span class="est">schatting</span>' : ""}</td>
            <td>${Math.round(d.chance_top3)}%</td></tr>`).join("")}</tbody>
        </table></div>
        ${contenders.length ? `<p class="cap">Nog niet gereden, wel kanshebber: ${contenders.map(d => `${esc(d.name)} (${Math.round(d.chance_top3)}%)`).join(", ")}.</p>` : ""}
        <button type="button" class="showall" data-split="${S.split}" aria-expanded="${isOpen}">${isOpen ? "Toon minder" : `Toon alle ${rows.length}`}</button>
      </div>`;
    }).join("");

    /* Footer */
    const hist = (R.history || []).map(h => h.kind === "prequal" ? "prequal VIR" : `${trackShort(h.track)} (${h.date})`).join(", ");
    $("note").textContent = `Volgorde = beste tijd die al op ${trackShort(R.track)} is gereden; rijders zonder tijd staan daaronder met een schatting. Gele rijen zijn de huidige top 3, Valkra-rijders staan altijd in de lijst. Verwacht = gemiddelde snelste ronde op racedag, met naar schatting nog ${Math.round(M.expected_extra_laps)} ronden per rijder (${M.test_days_left} testavond${M.test_days_left === 1 ? "" : "en"} en de kwalificatie). De target ligt sneller dan de verwachte tijd van de nummer 3, omdat in een veld van 30 altijd een paar rijders boven verwachting presteren. Pace is de snelste ronde, geen gemiddelde racepace.`;
    $("method").textContent = `Methode: ${M.description} Spreiding rond de lijn ${M.residual_sd.toFixed(2).replace(".", ",")} s${M.r2 != null ? ", R² " + M.r2.toFixed(2).replace(".", ",") : ""}, op ${M.fit_n} rijders. Geschiedenis in het model: ${hist}.`;
    $("source").textContent = `Bron: iRacing Data API, ${D.meta.league ? D.meta.league.name : "SRVN.nl NK-league"}. Splits volgens de prequal-eindstand en, zodra er gereden is, de officiële raceuitslag. Teams volgens de inschrijflijst.`;
  }

  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest(".showall");
    if (!b || !current) return;
    open[b.dataset.split] = !open[b.dataset.split];
    render(current);
  });

  /* Data loading: show the built-in copy at once, then the published JSON if it is reachable */
  let published = null;
  const msg = (text, kind) => { const el = $("admin-msg"); el.textContent = text; el.className = "msg" + (kind ? " " + kind : ""); };
  if (VALKRA_EMBEDDED_DATA && !problems(VALKRA_EMBEDDED_DATA).length) { published = VALKRA_EMBEDDED_DATA; render(published); }
  if (CONFIG.dataUrl) {
    fetch(CONFIG.dataUrl, { cache: "no-store" })
      .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
      .then(D => { if (!problems(D).length) { published = D; render(D); } })
      .catch(() => { if (!published) $("stamp").textContent = "Data kon niet worden geladen"; });
  }

  /* Admin: #beheer shows the import controls */
  const syncAdmin = () => { $("admin").hidden = location.hash !== "#beheer"; };
  window.addEventListener("hashchange", syncAdmin);
  syncAdmin();
  $("file").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    let D;
    try { D = JSON.parse(await file.text()); } catch (err) { msg(`${file.name} is geen geldige JSON.`, "err"); return; }
    const p = problems(D);
    if (p.length) { msg(`${file.name} mist: ${p.join(", ")}. Gebruik een export in hetzelfde formaat.`, "err"); return; }
    render(D);
    const when = new Date(D.meta.generated_at).toLocaleString("nl-NL", { timeZone: "Europe/Amsterdam" });
    if (!CONFIG.uploadUrl) { msg(`Ingeladen: stand ${when}. Alleen zichtbaar in deze browser. Zet het bestand als valkra-nk-prequal.json op de server om het voor iedereen te tonen.`, "ok"); return; }
    msg("Ingeladen. Opslaan op de site…");
    try {
      const fd = new FormData(); fd.append("file", file, "valkra-nk-prequal.json");
      const token = document.querySelector('meta[name="csrf-token"]');
      const res = await fetch(CONFIG.uploadUrl, { method: "POST", body: fd, credentials: "same-origin", headers: token ? { "X-CSRF-TOKEN": token.content } : {} });
      if (!res.ok) throw new Error("HTTP " + res.status);
      published = D;
      msg(`Opgeslagen: stand ${when}. Bezoekers zien deze data bij hun volgende bezoek.`, "ok");
    } catch (err) {
      msg(`Ingeladen in deze browser, maar opslaan op de site lukte niet (${err.message}). Controleer of je ingelogd bent.`, "err");
    }
  });
  $("reset").addEventListener("click", () => { if (published) { render(published); msg("Terug naar de gepubliceerde data."); } });
})();
</script>
